name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        polars: ["latest", "1.44.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: r-lib/actions/setup-r@v2
      - name: Install jsonlite (R checks)
        run: Rscript -e 'install.packages("jsonlite", repos = "https://cloud.r-project.org")'
      - run: uv sync --locked
      - name: Pin polars
        if: matrix.polars != 'latest'
        run: uv pip install "polars==${{ matrix.polars }}"
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -q
